<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار: حديث الأعمال بالنيات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf0ec; --card:#ffffff; --ink:#18271f; --muted:#5b6b62;
  --green:#0f4c3a; --green-2:#1d6b52; --brass:#b8892b;
  --ok:#1b7a4b; --okbg:#e3f4ea; --bad:#a63b2f; --badbg:#fbe9e6; --line:#d4ddd7;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1a15; --card:#17261f; --ink:#e8f0eb; --muted:#9bb0a4; --green:#5fc9a1; --green-2:#7fdcb8;
    --brass:#d9b25a; --ok:#6fdc9f; --okbg:#173a28; --bad:#ff9a8c; --badbg:#3d1f1b; --line:#2b4036;}
}
*{box-sizing:border-box}
html{scroll-padding-top:12px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;font-size:18px;line-height:1.8;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 48px}
header{padding:20px 4px 8px}
h1{font-family:'Amiri','Tajawal',serif;font-size:2rem;line-height:1.4;margin:0;color:var(--green)}
.sub{color:var(--muted);margin:4px 0 0;font-size:1rem}
.bar{height:6px;background:var(--line);border-radius:3px;margin:18px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--brass);transition:width .3s}
.count{color:var(--muted);font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;margin-top:14px}
.q{font-family:'Amiri','Tajawal',serif;font-size:1.45rem;line-height:1.9;margin:0 0 16px;font-weight:700}
.kind{display:inline-block;font-size:.85rem;color:var(--green);border:1px solid var(--green);border-radius:999px;padding:0 10px;margin-bottom:10px;line-height:1.7}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:right;background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--green-2)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.opt.sel{border-color:var(--green);background:var(--okbg)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px}
textarea{min-height:90px;resize:vertical}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 22px;cursor:pointer;background:var(--green);color:#fff}
@media (prefers-color-scheme:dark){.btn{color:#0f1a15}}
.btn.alt{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.fb{margin-top:16px;border-radius:10px;padding:12px 14px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.no{background:var(--badbg);color:var(--bad)}
.fb b{display:block}
.fb span{color:var(--ink)}
.score{font-family:'Amiri',serif;font-size:3rem;color:var(--green);margin:0;line-height:1.3}
.rev{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.rev li{border-right:4px solid var(--bad);padding:2px 12px}
.rev small{display:block;color:var(--muted)}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>الأعمال بالنيات</h1>
    <p class="sub">اختبار متنوع على الحديث الأول — يقبل الإجابات القريبة</p>
  </header>

  <div id="quiz">
    <div class="bar" aria-hidden="true"><i id="prog"></i></div>
    <div class="count" id="count"></div>
    <section class="card" id="card" aria-live="polite"></section>
  </div>

  <section class="card hide" id="result"></section>
</div>

<script>
/* ============ بنك الأسئلة (الإجابات من نص الدرس فقط) ============
 t:'mcq'  اختيار من متعدد   (opts, a = رقم الإجابة الصحيحة)
 t:'tf'   صح / خطأ          (a = true/false, why = توضيح)
 t:'fill' إجابة كتابية       (accept = إجابات مقبولة، show = الإجابة المعروضة)
 t:'kw'   إجابة بالمعنى      (groups = مجموعات كلمات مفتاحية، need = العدد المطلوب، must = مجموعات إلزامية)
*/
const BANK = [
  {t:'mcq', q:'من هو راوي هذا الحديث؟',
   opts:['عمر بن الخطاب رضي الله عنه','أبو بكر الصديق رضي الله عنه','عثمان بن عفان رضي الله عنه','علي بن أبي طالب رضي الله عنه'], a:0},
  {t:'mcq', q:'ما لقب عمر بن الخطاب رضي الله عنه؟',
   opts:['الصديق','الفاروق','ذو النورين','سيف الله'], a:1},
  {t:'mcq', q:'في أي عام استشهد عمر رضي الله عنه؟',
   opts:['13هـ','35هـ','23هـ','40هـ'], a:2},
  {t:'mcq', q:'من الذي قتل عمر رضي الله عنه؟',
   opts:['أبو لؤلؤة المجوسي','أبو جهل','عبد الله بن سبأ','أبو سفيان'], a:0},
  {t:'mcq', q:'الهجرة في الحديث تعني:',
   opts:['السفر للتجارة','الانتقال من دار الشرك إلى دار الإسلام','الانتقال من مدينة إلى أخرى','ترك الأهل والأصدقاء'], a:1},

  {t:'tf', q:'عمر بن الخطاب رضي الله عنه هو ثالث الخلفاء الراشدين.', a:false,
   why:'هو ثاني الخلفاء الراشدين.'},
  {t:'tf', q:'كان إسلام عمر رضي الله عنه نصرًا عظيمًا للمسلمين.', a:true,
   why:'نص الدرس: «كان إسلامه نصراً عظيماً للمسلمين».'},
  {t:'tf', q:'الله تعالى يقبل العمل حتى لو لم يكن خالصًا لوجهه الكريم.', a:false,
   why:'الله لا يقبل العمل إلا إذا كان خالصًا لوجهه الكريم.'},

  {t:'fill', q:'أكمل: «إنما الأعمال ........ ».',
   accept:['بالنيات','بالنية'], show:'بالنيات'},
  {t:'fill', q:'أكمل: «وإنما لكل امرئ ما ........ ».',
   accept:['نوى'], show:'نوى'},
  {t:'fill', q:'أكمل نسب الراوي: عمر بن الخطاب بن ........ العدوي القرشي.',
   accept:['نفيل'], show:'نفيل'},
  {t:'fill', q:'أكمل: «ومن كانت هجرته لدنيا يصيبها أو امرأة ينكحها فهجرته إلى ........ ».',
   accept:['ما هاجر إليه','إلى ما هاجر إليه'], show:'ما هاجر إليه'},
  {t:'fill', q:'ما معنى كلمة «النية»؟',
   accept:['إرادة العمل','ارادة الفعل','قصد العمل'], show:'إرادة العمل'},

  {t:'kw', q:'اذكر فائدة من فوائد الحديث.',
   groups:[['خالص','خالصا','خالصاً','لوجهه','وجهه','الاخلاص','اخلاص'],['يقبل','قبول','تقبل'],['العمل','الاعمال','عمل']],
   must:[0], need:2,
   show:'أن الله تعالى لا يقبل العمل إلا إذا كان خالصًا لوجهه الكريم.'},
  {t:'kw', q:'من هو أمير المؤمنين وثاني الخلفاء الراشدين الذي روى الحديث؟ اذكر اسمه الكامل.',
   groups:[['عمر'],['الخطاب'],['نفيل'],['العدوي','القرشي']],
   must:[0,1], need:2,
   show:'عمر بن الخطاب بن نفيل العدوي القرشي رضي الله عنه.'}
];

/* ============ مطابقة الإجابات القريبة ============ */
function norm(s){
  return (s||'')
    .replace(/[\u064B-\u065F\u0670\u0640]/g,'')      // تشكيل وتطويل
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/[^\u0621-\u064Aa-z0-9\s]/gi,' ')         // علامات الترقيم
    .replace(/\s+/g,' ').trim();
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    prev=cur;
  }
  return prev[n];
}
function sim(a,b){ const L=Math.max(a.length,b.length); return L?1-lev(a,b)/L:1; }
function stripAl(s){ return s.split(' ').map(w=>w.replace(/^(ال|وال|بال|لل)/,'')).join(' '); }

function fillOK(ans, accept){
  const a = norm(ans); if(!a) return false;
  return accept.some(x=>{
    const t = norm(x);
    if (a===t || stripAl(a)===stripAl(t)) return true;
    if (sim(a,t) >= (t.length<=5 ? 0.74 : 0.8)) return true;        // خطأ إملائي بسيط
    if (t.length>=3 && a.includes(t) && a.length <= t.length*3) return true;   // إجابة داخل جملة
    return false;
  });
}
function kwHit(ansTokens, ansFull, word){
  const w = norm(word);
  if (w.includes(' ')) return ansFull.includes(w);
  return ansTokens.some(tk=>{
    const x = stripAl(tk), y = stripAl(w);
    return x===y || (y.length>=4 && x.includes(y)) || (y.length>=4 && sim(x,y)>=0.8);
  });
}
function kwOK(ans, q){
  const full = norm(ans); if(!full) return false;
  const toks = full.split(' ');
  const hit = q.groups.map(g=>g.some(w=>kwHit(toks, full, w)));
  const must = (q.must||[]).every(i=>hit[i]);
  return must && hit.filter(Boolean).length >= q.need;
}

/* ============ منطق الاختبار ============ */
const $ = id=>document.getElementById(id);
let list=[], idx=0, score=0, wrong=[], answered=false, picked=null;

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function start(questions){
  list = shuffle(questions).map(q=>{
    if(q.t==='mcq'){
      const order = shuffle(q.opts.map((o,i)=>i));
      return {...q, opts:order.map(i=>q.opts[i]), a:order.indexOf(q.a)};
    }
    return q;
  });
  idx=0; score=0; wrong=[];
  $('result').classList.add('hide'); $('quiz').classList.remove('hide');
  render();
}

const KIND = {mcq:'اختيار من متعدد', tf:'صح أم خطأ', fill:'أكمل', kw:'أجب بجملة'};

function render(){
  answered=false; picked=null;
  const q=list[idx];
  $('count').textContent = `السؤال ${idx+1} من ${list.length}`;
  $('prog').style.width = (idx/list.length*100)+'%';
  let body = `<span class="kind">${KIND[q.t]}</span><p class="q">${esc(q.q)}</p>`;
  if(q.t==='mcq'){
    body += `<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  } else if(q.t==='tf'){
    body += `<div class="opts"><button class="opt" data-i="1">صح</button><button class="opt" data-i="0">خطأ</button></div>`;
  } else if(q.t==='fill'){
    body += `<input type="text" id="ans" autocomplete="off" placeholder="اكتب إجابتك هنا">`;
  } else {
    body += `<textarea id="ans" placeholder="اكتب إجابتك بأسلوبك"></textarea>`;
  }
  body += `<div id="fb"></div><div class="row"><button class="btn" id="check">تحقق</button><button class="btn alt hide" id="next">${idx===list.length-1?'عرض النتيجة':'السؤال التالي'}</button></div>`;
  $('card').innerHTML = body;

  document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    if(answered) return;
    document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); picked=+b.dataset.i;
  }));
  $('check').addEventListener('click',check);
  $('next').addEventListener('click',next);
  const a=$('ans'); if(a){ a.focus({preventScroll:true}); if(q.t==='fill') a.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); answered?next():check(); } }); }
}

function check(){
  if(answered) return;
  const q=list[idx]; let ok=false, shown='', why='';
  if(q.t==='mcq'||q.t==='tf'){
    if(picked===null){ $('fb').innerHTML=`<div class="fb no">اختر إجابة أولًا.</div>`; return; }
    ok = q.t==='mcq' ? picked===q.a : (picked===1)===q.a;
    document.querySelectorAll('.opt').forEach(b=>{
      const i=+b.dataset.i; b.disabled=true;
      const isRight = q.t==='mcq' ? i===q.a : (i===1)===q.a;
      if(isRight) b.classList.add('right'); else if(i===picked) b.classList.add('wrong');
    });
    shown = q.t==='mcq' ? q.opts[q.a] : (q.a?'صح':'خطأ');
    why = q.why||'';
  } else {
    const v=$('ans').value;
    if(!v.trim()){ $('fb').innerHTML=`<div class="fb no">اكتب إجابتك أولًا.</div>`; return; }
    ok = q.t==='fill' ? fillOK(v,q.accept) : kwOK(v,q);
    $('ans').disabled=true; shown=q.show;
  }
  answered=true;
  if(ok) score++; else wrong.push({q:q, shown:shown});
  $('fb').innerHTML = ok
    ? `<div class="fb ok"><b>إجابة صحيحة ✓</b>${why?`<span>${esc(why)}</span>`:''}</div>`
    : `<div class="fb no"><b>إجابة غير صحيحة</b><span>الإجابة الصحيحة: ${esc(shown)}${why?` — ${esc(why)}`:''}</span></div>`;
  $('check').classList.add('hide'); $('next').classList.remove('hide'); $('next').focus({preventScroll:true});
}

function next(){
  if(idx<list.length-1){ idx++; render(); } else finish();
}

function finish(){
  $('quiz').classList.add('hide');
  const total=list.length, pct=Math.round(score/total*100);
  const msg = pct>=90?'ممتاز، أنت متقن للحديث.':pct>=70?'جيد جدًا، راجع الأخطاء وستصل للإتقان.':pct>=50?'مقبول، أعد قراءة الدرس ثم جرّب مرة أخرى.':'راجع الدرس بهدوء ثم أعد المحاولة.';
  let h = `<p class="score">${score} / ${total}</p><p>${msg}</p>`;
  if(wrong.length){
    h += `<h2 style="font-family:Amiri,serif;color:var(--green);margin:18px 0 0">للمراجعة</h2><ul class="rev">` +
      wrong.map(w=>`<li>${esc(w.q.q)}<small>الإجابة: ${esc(w.shown)}</small></li>`).join('') + `</ul>`;
  }
  h += `<div class="row"><button class="btn" id="again">اختبار جديد</button>${wrong.length?'<button class="btn alt" id="redo">أعد الأسئلة الخاطئة فقط</button>':''}</div>`;
  const r=$('result'); r.innerHTML=h; r.classList.remove('hide');
  $('again').onclick=()=>start(BANK);
  const redo=$('redo'); if(redo) redo.onclick=()=>start(wrong.map(w=>BANK.find(b=>b.q===w.q.q)));
  window.scrollTo({top:0,behavior:'smooth'});
}

start(BANK);
</script>
</body>
</html>
